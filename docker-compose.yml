services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-budgettracker}
      POSTGRES_USER: ${DB_USER:-budgetuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-budgetuser} -d ${DB_NAME:-budgettracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-budgetuser}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
      DB_NAME: ${DB_NAME:-budgettracker}
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
